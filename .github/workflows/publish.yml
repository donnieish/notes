name: Sync Notion and publish donnie.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: Replace the live Pages release after validation
        type: boolean
        required: true
        default: false
  workflow_call:
    inputs:
      publish:
        type: boolean
        required: true

permissions:
  contents: read
  pages: read
concurrency:
  group: donnie-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    outputs:
      changed: ${{ steps.build.outputs.changed }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/configure-pages@v5
        id: pages
      - name: Install pinned dependencies
        run: pnpm install --frozen-lockfile
      - name: Install HEIC decoder for Notion images
        run: |
          sudo apt-get -qq update
          sudo apt-get -qq install --no-install-recommends libheif-examples libheif-plugin-libde265
      - name: Validate code
        run: pnpm check && pnpm test
      - name: Validate Notion and build
        id: build
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_ARTICLES_ID: ${{ vars.NOTION_ARTICLES_ID }}
          NOTION_COPY_SOURCE_ID: ${{ vars.NOTION_COPY_SOURCE_ID }}
          REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          SITE_URL: ${{ steps.pages.outputs.base_url }}
          ANALYTICS_ORIGIN: ${{ vars.ANALYTICS_ORIGIN }}
          ALLOW_EMPTY_BLOG: ${{ vars.ALLOW_EMPTY_BLOG }}
          SKIP_UNCHANGED: ${{ inputs.publish == true }}
        run: pnpm build
      - uses: actions/upload-pages-artifact@v4
        if: steps.build.outputs.changed == 'true' && (inputs.publish == true)
        with:
          path: dist
          retention-days: 1

  publish:
    needs: build
    if: needs.build.outputs.changed == 'true' && (inputs.publish == true)
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deploy
